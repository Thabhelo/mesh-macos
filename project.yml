name: Mesh
packages:
  MeshPackages:
    path: .
options:
  bundleIdPrefix: com.mesh
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_NAME: Mesh
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    INFOPLIST_FILE: Mesh/Info.plist
    CODE_SIGN_ENTITLEMENTS: Mesh/Mesh.entitlements
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES

targets:
  Mesh:
    type: application
    platform: macOS
    dependencies:
      - package: MeshPackages
        products:
          - MeshBackendCore
    sources:
      - path: Mesh
        excludes:
          - "*.md"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Mesh/Info.plist
    entitlements:
      path: Mesh/Mesh.entitlements

