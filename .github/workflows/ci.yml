name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test-lint:
    name: Build, Test, and Lint
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Show tool versions
        run: |
          xcodebuild -version
          swift --version

      - name: Run SwiftPM tests
        run: swift test

      - name: Build macOS app
        run: xcodebuild -project Mesh.xcodeproj -scheme Mesh -destination 'platform=macOS' build

      - name: Install SwiftFormat
        run: brew install swiftformat

      - name: Lint Swift formatting
        run: swiftformat Mesh Tests Package.swift --lint --rules duplicateImports,semicolons --swiftversion 5.9
